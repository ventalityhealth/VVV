<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized leaf shapes for animation — each is individually animatable -->
  
  <!-- Leaf 1: large fern frond -->
  <g id="leaf-fern" data-gsap="leaf-1">
    <path d="M 30 180 Q 50 140, 60 100 Q 55 80, 40 60 Q 35 80, 20 100 Q 10 140, 30 180 Z" 
          fill="#2d5a27" opacity="0.9"/>
    <line x1="30" y1="180" x2="45" y2="70" stroke="#1e3d1a" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Leaf 2: oval botanical -->
  <g id="leaf-oval" data-gsap="leaf-2">
    <path d="M 120 160 Q 150 130, 170 100 Q 160 70, 140 50 Q 120 70, 110 100 Q 100 130, 120 160 Z"
          fill="#3a6b33" opacity="0.85"/>
    <line x1="120" y1="160" x2="148" y2="60" stroke="#1e3d1a" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Leaf 3: pointed tropical -->
  <g id="leaf-pointed" data-gsap="leaf-3">
    <path d="M 240 170 Q 255 130, 270 90 Q 265 70, 250 50 Q 245 70, 235 90 Q 225 130, 240 170 Z"
          fill="#2d5a27" opacity="0.8"/>
  </g>
  
  <!-- Small accent leaves -->
  <g id="leaf-small-1" data-gsap="leaf-4">
    <path d="M 80 140 Q 90 125, 100 115 Q 95 108, 85 110 Q 80 125, 80 140 Z"
          fill="#4a8c3f" opacity="0.7"/>
  </g>
  
  <g id="leaf-small-2" data-gsap="leaf-5">
    <path d="M 200 130 Q 210 118, 215 108 Q 210 100, 200 105 Q 198 118, 200 130 Z"
          fill="#4a8c3f" opacity="0.7"/>
  </g>
</svg>